name: 'ecommerce_growth'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_growth'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  ecommerce_growth:             # ← project name
    +catalog: analytics         # ← correct catalog for all models

    staging:
      +materialized: view
      +schema: staging          # → analytics.staging

    intermediate:
      +materialized: table
      +schema: intermediate     # → analytics.intermediate

    marts:
      +materialized: table
      +schema: marts            # → analytics.marts (prod_analytics comes from profiles.yml)
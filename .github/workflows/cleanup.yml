name: Cleanup Ephemeral Schemas

on:
  pull_request:
    types: [closed]
  workflow_dispatch: 

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Snowflake CLI
        run: |
          pip install --quiet snowflake-cli-labs

      - name: Drop PR Schema
        env:
          DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
          DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ACCOUNTADMIN
          SNOWFLAKE_WAREHOUSE: DBT_WH
        run: |
          snow sql \
            --account "$DBT_SNOWFLAKE_ACCOUNT" \
            --user "$DBT_SNOWFLAKE_USER" \
            --password "$SNOWFLAKE_PASSWORD" \
            --role "$SNOWFLAKE_ROLE" \
            --private-key-file "$SNOWFLAKE_PRIVATE_KEY" \
            -q "DROP SCHEMA IF EXISTS ${SNOWFLAKE_DATABASE}.PR_${{ github.event.number }} CASCADE;"

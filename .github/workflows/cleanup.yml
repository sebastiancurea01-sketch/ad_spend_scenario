name: dbt CI Schema Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

    steps:
      - name: Install Snowflake CLI
        run: pip install snowflake-cli-labs

      - name: Drop ephemeral CI schema
        run: |
          snow sql -q "DROP SCHEMA IF EXISTS ANALYTICS_CI.PR_${{ github.event.pull_request.number }} CASCADE;"
        env:
          SNOWFLAKE_ROLE: ACCOUNTADMIN
          SNOWFLAKE_WAREHOUSE: DBT_WH

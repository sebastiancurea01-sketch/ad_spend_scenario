name: dbt CD - Deploy to Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger-dbt-cloud-job:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger dbt Cloud Job
        run: |
          response=$(curl -s -X POST \
          -H "Authorization: Bearer ${{ secrets.DBT_CLOUD_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"cause": "Triggered by GitHub Actions CD"}' \
          "https://cloud.getdbt.com/api/v2/accounts/${{ secrets.DBT_ACCOUNT_ID }}/jobs/${{ secrets.DBT_JOB_ID }}/run/")
          echo $response

      - name: Check job triggered successfully
        run: |
          echo "dbt Cloud Job triggered ✅"
          echo "Monitor progress at: https://cloud.getdbt.com"

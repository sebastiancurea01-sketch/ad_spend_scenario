
name: dbt CD - Deploy to Prod

on:
  push:
    branches:
      - main        
  workflow_dispatch:

jobs:
  dbt-prod-run:
    runs-on: ubuntu-latest

    env:
      TOKEN: ${{ secrets.TOKEN }}
      DBT_DATABRICKS_HOST: ${{ secrets.DBT_DATABRICKS_HOST }}
      DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
      # Databricks CLI credentials
      DATABRICKS_HOST: ${{ secrets.DBT_DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Cache pip dependencies             # 3. cache BEFORE install
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dbt-databricks

      - name: Install dbt
        run: pip install dbt-databricks

      - name: Install dbt packages
        run: dbt deps --profiles-dir .

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v0.221.0

      - name: Run dbt models in prod
        run: dbt run --target prod --profiles-dir .

      - name: Sync Manifest to Databricks Volume
        run: |
          databricks fs cp target/manifest.json \
            dbfs:/Volumes/analytics/default/dbt_state/manifest.json \
            --overwrite
      

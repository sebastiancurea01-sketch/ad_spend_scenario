
name: dbt CD - Deploy to Prod

on:
  push:
    branches:
      - main        # ← triggers when PR merges to main
  workflow_dispatch:

jobs:
  dbt-prod-run:
    runs-on: ubuntu-latest

    env:
      TOKEN: ${{ secrets.TOKEN }}
      DBT_DATABRICKS_HOST: ${{ secrets.DBT_DATABRICKS_HOST }}
      DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Cache pip dependencies             # 3. cache BEFORE install
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dbt-databricks

      - name: Install dbt
        run: pip install dbt-databricks

      - name: Install dbt packages
        run: dbt deps --profiles-dir .

      - name: Run dbt models in prod
        run: dbt run --target prod --profiles-dir .

      - name: Upload manifest to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: prod-manifest
          path: target/manifest.json        # ← saves manifest for Slim CI to use

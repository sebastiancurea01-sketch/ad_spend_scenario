name: dbt Slim CI

on:
  pull_request:
    branches:
      - main

jobs:
  slim_ci_run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run dbt (Bootstrap - No Defer)
        run: dbt build --target prod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt & Databricks adapter
        run: |
          pip install --upgrade pip
          pip install dbt-databricks

      - name: Install dbt packages
        run: dbt deps

      - name: Download prod manifest           
        uses: actions/download-artifact@v4
        with:
          name: prod-manifest
          path: ./prod-manifest

      # To run Slim CI, dbt needs the production state. 
      # In a real enterprise, we download the manifest.json from a cloud bucket.
      # For a portfolio, compiling the main branch first is a clean workaround.
      - name: Get Production State for Comparison
        env:
          DBT_DATABRICKS_HOST: ${{ secrets.DBT_DATABRICKS_HOST }}
          DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          git checkout main
          dbt compile --target prod
          mkdir -p ./state
          cp target/manifest.json ./state/
          git checkout -

      - name: Run Slim CI (Only Modified Models)
        env:
          DBT_DATABRICKS_HOST: ${{ secrets.DBT_DATABRICKS_HOST }}
          DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
          TOKEN: ${{ secrets.TOKEN }}
        # The magic command: Run only modified models and their children (+)
        # using the production state we just grabbed as a baseline.
        run: dbt build --target prod

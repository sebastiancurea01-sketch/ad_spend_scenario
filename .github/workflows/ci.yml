name: dbt Slim CI

on:
  pull_request:
    branches:
      - main

# ADDED to grant permission to ghcr
permissions:
  contents: read
  packages: read

# ADDED
env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dbt-ci-image

jobs:
  slim_ci_run:
    runs-on: ubuntu-latest
  
  # ADDED
    container:
      image: ghcr.io/${{ github.repository_owner }}/dbt-ci-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # NO CHANGE
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      ## added as requested from logs error
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      
      - name: Fetch Main Branch
        run: git fetch origin main:main

      # remove install Databricks CLI

      # NO CHANGE
      - name: Fetch Prod Manifest from Databricks Volume
        env:
          # Dynamically prepends https:// for databricks-cli while leaving the GitHub Secret clean for dbt
          DATABRICKS_HOST: "https://${{ secrets.DBT_DATABRICKS_HOST }}"
          DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}
        run: |
          mkdir -p ./state
          databricks fs cp dbfs:/Volumes/analytics/default/dbt_state/manifest.json \
            ./state/manifest.json || echo "No production manifest found."
      
      # remove build docker image

      - name: Lint SQL with sqlfluff
        run: |
          docker run --rm \
            -e DBT_DATABRICKS_HOST="${{ secrets.DBT_DATABRICKS_HOST }}" \
            -e DBT_DATABRICKS_TOKEN="${{ secrets.DBT_DATABRICKS_TOKEN }}" \
            -e DBT_DATABRICKS_HTTP_PATH="${{ secrets.DBT_DATABRICKS_HTTP_PATH }}" \
            dbt-local sh -c "dbt deps && sqlfluff lint models/"

      # NO CHANGE just docker run -> dbt run
      - name: Run dbt Slim CI in Docker
        run: |
          dbt run --rm \
            -v ${PWD}/state:/app/state \
            -e DBT_DATABRICKS_HOST="${{ secrets.DBT_DATABRICKS_HOST }}" \
            -e DBT_DATABRICKS_TOKEN="${{ secrets.DBT_DATABRICKS_TOKEN }}" \
            -e DBT_DATABRICKS_HTTP_PATH="${{ secrets.DBT_DATABRICKS_HTTP_PATH }}" \
            -e DBT_SCHEMA="pr_${{ github.event.number }}" \
            dbt-local sh -c "dbt deps && if [ -f state/manifest.json ]; then dbt build --select state:modified+ --defer --state state --target ci; else dbt build --target ci; fi"
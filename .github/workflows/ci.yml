name: dbt Slim CI

on:
  pull_request:
    branches:
      - main

jobs:
  slim_ci_run:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dbt-ci-image
      IMAGE_TAG: latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Fetch Main Branch
        run: git fetch origin main:main
 
      - name: Install Databricks CLI
        uses: databricks/setup-cli@v0.221.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: docker pull "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Fetch Prod Manifest from Databricks Volume
        env:
          # Dynamically prepends https:// for databricks-cli while leaving the GitHub Secret clean for dbt
          DATABRICKS_HOST: "https://${{ secrets.DBT_DATABRICKS_HOST }}"
          DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}
        run: |
          mkdir -p ./state
          databricks fs cp dbfs:/Volumes/analytics/default/dbt_state/manifest.json \
            ./state/manifest.json || echo "No production manifest found."
      
      - name: Lint SQL with sqlfluff
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -e DBT_DATABRICKS_HOST="${{ secrets.DBT_DATABRICKS_HOST }}" \
            -e DBT_DATABRICKS_TOKEN="${{ secrets.DBT_DATABRICKS_TOKEN }}" \
            -e DBT_DATABRICKS_HTTP_PATH="${{ secrets.DBT_DATABRICKS_HTTP_PATH }}" \
            "${IMAGE_NAME}:${IMAGE_TAG}" sh -c "dbt deps && sqlfluff lint models/"

      # To run Slim CI, dbt needs the production state
      - name: Run dbt Slim CI in Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -e DBT_DATABRICKS_HOST="${{ secrets.DBT_DATABRICKS_HOST }}" \
            -e DBT_DATABRICKS_TOKEN="${{ secrets.DBT_DATABRICKS_TOKEN }}" \
            -e DBT_DATABRICKS_HTTP_PATH="${{ secrets.DBT_DATABRICKS_HTTP_PATH }}" \
            -e DBT_SCHEMA="pr_${{ github.event.number }}" \
            "${IMAGE_NAME}:${IMAGE_TAG}" sh -c "dbt deps && if [ -f state/manifest.json ]; then dbt build --select state:modified+ --defer --state state --target ci; else dbt build --target ci; fi"
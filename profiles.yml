# ~/.dbt/profiles.yml (Locally) or pushed safely to GitHub (No hardcoded passwords!)
ecommerce_growth:
  target: dev
  outputs:
    
    # 1. LOCAL DEV: Used when you type dbt run on your laptop
    dev:
      type: databricks
      catalog: analytics
      schema: dbt_scurea
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN') }}"
    
    # 2. SLIM CI: Used by GitHub Actions when you open a Pull Request
    ci:
      type: databricks
      catalog: analytics
      # Dynamically creates a temporary schema for every PR (e.g., pr_42)
      # This prevents developers from overwriting each other's test data
      schema: "{{ env_var('DBT_SCHEMA') }}"
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN') }}"
      
    # 3. PRODUCTION: Used by GitHub Actions when code merges to main
    prod:
      type: databricks
      catalog: analytics
      schema: prod_analytics
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN') }}"
      auth_type: token # <--- CRITICAL: Force token authentication for headless runners
      threads: 4
    
    dev_scratch: # <--- Must match --target dev_scratch
      type: databricks
      catalog: analytics
      schema: "{{ env_var('DBT_SCHEMA') }}"
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN') }}"
      auth_type: token

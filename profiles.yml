ecommerce_growth:
    target: ci
    outputs:
        ci:
        type: snowflake
        account: "{{ env_var('DBT_SNOWFLAKE_ACCOUNT') }}"
        user: "{{ env_var('DBT_SNOWFLAKE_USER') }}"
        private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY') }}"
        role: ACCOUNTADMIN
        database: TOY_STORE_DEV
        warehouse: DBT_WH
        # Dynamically creates a temporary schema for every PR (e.g., pr_42)
        # This prevents developers from overwriting each other's test data
        schema: "{{ env_var('DBT_SCHEMA') }}"
        threads: "{{ env_var('DBT_THREADS', '4') | int }}"